name: testora_flutter_ui
description: Testora mobile exam preparation UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  google_fonts: ^6.3.2
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.0.10
  fl_chart: ^1.1.1
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#090909"
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    color_dark: "#090909"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#090909"
