name: testora_flutter_ui
description: Testora mobile exam preparation UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  google_fonts: ^6.3.2
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.0.10
  fl_chart: ^1.1.1
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F1117"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo_dark.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F1117"
    image: assets/images/android12_splash.png
    image_dark: assets/images/android12_splash_dark.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#0F1117"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
